schema: spec-driven

context: |
  Product: OpsKnowledge, a bilingual technical knowledge platform over approved, versioned runbooks, ADRs, and operational policies.
  Architecture: feature-organized modular monolith with hexagonal boundaries; one process and PostgreSQL own durable state.
  Planned stack: FastAPI, React/Vite, PostgreSQL/pgvector, SQLAlchemy 2, Alembic, Psycopg 3, Docling, and a replaceable generation/embedding provider.
  Current state: documentation baseline only; no runtime source, manifests, lockfiles, test runner, Makefile, or CI pipeline.
  Authority order: AGENTS.md, RAG_ROADMAP.md, docs/architecture/platform-architecture.md, then SDD artifacts.
  Safety: grounded citations, language-isolated retrieval, abstention, no visual evidence interpretation, and no partial active index.

artifact_store:
  mode: hybrid
  engram_project: rag

workflow:
  execution_mode: interactive
  chained_pr_strategy: ask-always
  review_budget_lines: 800

strict_tdd: false

testing:
  detected: 2026-07-15
  strict_tdd: false
  rationale: No runtime stack or test runner exists; the first implementation change must establish the harness and then re-evaluate Strict TDD.
  test_runner:
    available: false
    command: ""
    framework: ""
  layers:
    unit: false
    integration: false
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: false
      command: ""
    type_checker:
      available: false
      command: ""
    formatter:
      available: false
      command: ""

rules:
  proposal:
    - Keep changes bounded, independently reversible, and aligned to the roadmap phase order.
    - Include a rollback plan for risky changes.
  specs:
    - Use RFC 2119 keywords and Given/When/Then scenarios.
    - Preserve safety, evidence, language-isolation, provider-failure, and prototype/corporate boundary invariants.
  design:
    - Keep frameworks and providers outside domain and application boundaries.
    - Document architecture decisions and sequence diagrams for complex flows.
  tasks:
    - Group tasks by phase and keep each task completable in one session.
    - Establish the test harness before runtime implementation and re-evaluate Strict TDD.
  apply:
    rules:
      - Follow the documented architecture and dependency governance process.
      - Do not introduce excluded dependencies or TI-gated corporate integrations without a new approved SDD change.
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Never modify or delete archived changes; retain supersession lineage.
