[project]
name = "opsknowledge"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.21",
    "pyright==1.1.411",
    "pip-audit==2.10.1",
    "pip-licenses==5.5.5",
    "pyyaml==6.0.3",
]

[tool.pyright]
include = ["tests"]
exclude = ["**/__pycache__", ".venv", ".git"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportUnusedImport = "warning"
reportMissingParameterType = "warning"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "__pycache__", ".git", ".ruff_cache", ".pyright_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -m 'not ci_recipe'"
filterwarnings = ["error"]
markers = [
    "ci_recipe: tests that invoke make targets (excluded from gate to avoid recursion)",
]

[tool.coverage.run]
source = ["scripts"]
branch = true